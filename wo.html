.strip i { position: absolute; top: 0; bottom: 0; }

.strip .h0 { left: 0; transform: none; } .strip .h6 { left: 25%; } .strip .h12 { left: 50%; } .strip .h18 { left: 75%; } .strip .h24 { left: 100%; transform: translateX(-100%); }

table.wo tr.ev.plan td { background: var(--tint-2); }
table.wo tr.ev.wait td { background: var(--bad-bg); }

.wo-dl { margin: 0 0 4px; line-height: 1.45; } .wo-dl b { font-weight: 700; } .wo-dm { color: var(--warn); font-weight: 800; } .wo-d0 { color: var(--ink-3); font-weight: 700; }

table.t.cond td.l, table.t.cond th.l { text-align: left !important; }
.wo-how h3 { font-size: 15px; margin: 14px 0 2px; }
.gt { display: inline-block; border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: 700; margin-left: 4px; }
