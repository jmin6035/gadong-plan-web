<style>
.wo-how { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 10px 14px; margin: 0 0 12px; }
.wo-how summary { cursor: pointer; font-weight: 700; }
.wo-how ol { margin: 8px 0 4px 20px; padding: 0; line-height: 1.7; }
.wo-how p { margin: 6px 0 0; color: var(--ink-2); font-size: 13.5px; }
.wo-cmp { border-left: 4px solid var(--good); background: var(--good-bg); padding: 9px 13px; border-radius: 6px; margin: 12px 0 0; }
.wo-cmp.bad { border-left-color: var(--warn); background: var(--warn-bg); }
table.wo td { white-space: nowrap; }
table.t.wo td.l { text-align: left !important; white-space: normal; min-width: 300px; max-width: 460px; }
table.wo .why { font-size: 12.5px; color: var(--brand-2); }
table.wo td.tm { font-variant-numeric: tabular-nums; }
table.wo td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.t.wo tr.day td { background: var(--sub); font-weight: 700; text-align: left !important; border-top: 2px solid var(--line); position: sticky; left: 0; }
table.wo tr.day td small { font-weight: 400; color: var(--ink-2); margin-left: 10px; }
table.t.wo tr.ev td { text-align: left !important; font-size: 13.5px; }
table.wo tr.ev.plan td { background: var(--warn-bg); }
table.wo tr.ev.wait td { background: var(--bad-bg); }
table.wo td.dn b { color: var(--warn); }
table.wo td.dn0 { color: var(--ink-3); }
.gt { display: inline-block; border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: 700; margin-left: 4px; }
.gt1 { background: var(--gt-g); color: var(--gc-g); } .gt2 { background: var(--gt-c); color: var(--gc-c); } .gt3 { background: var(--grid); color: var(--ink-2); }
.bk { font-size: 12px; color: var(--ink-3); }
.rdy { color: var(--warn); font-weight: 700; }
details.fx summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
.miss { border-left: 4px solid var(--warn); background: var(--warn-bg); padding: 8px 12px; border-radius: 6px; margin: 8px 0 12px; }
</style>

        <p class="hint" id="wo-msg"></p></div>
    </section>
  </div>
</main>
