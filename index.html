<link rel="stylesheet" href="ui/theme.css?v=2610220758">
<style>
/* ===== 홈 대시보드: 촘촘한 격자 · 숫자와 막대 중심 · 설명은 접기 ===== */
.dash { display: grid; gap: 12px; margin-top: 10px; }
.dash .card { margin: 0; padding: 14px 16px; }
.dash .card > h2 { font-size: 16px; margin: 0 0 10px; }
.dash .card > h2 small { font-size: 12.5px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
.meta b { color: var(--ink); font-weight: 700; }
.meta .tabs button { font-size: 13px; padding: 4px 10px; }
/* ===== 오너 한눈에: 상태 4칸(주간보고와 같은 기준) ===== */

.ot { position: relative; display: block; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--tc, var(--good)); border-radius: 10px; padding: 14px 16px 12px; color: var(--ink); text-decoration: none; }

.ot.good { --tc: var(--good); } .ot.warn { --tc: var(--warn); } .ot.bad { --tc: var(--bad); }
.ot .hd { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; }
.ot .st { margin-left: auto; font-size: 13px; font-weight: 800; color: var(--tc); border: 1px solid var(--tc); border-radius: 999px; padding: 1px 9px; }

/* 월말·4분기 전망(10/21 재작성) */

.fp-g { margin-bottom: 14px; } .fp-gh { font-size: 15px; font-weight: 800; margin-bottom: 8px; } .fp-gh small { font-weight: 500; color: var(--ink-3); font-size: 13px; margin-left: 6px; }
.fp-r { display: grid; grid-template-columns: 44px 1fr 150px; align-items: center; gap: 10px; margin: 7px 0; font-variant-numeric: tabular-nums; }
.fp-m { font-size: 14px; color: var(--ink-2); font-weight: 700; }
.fp-b { position: relative; height: 18px; background: var(--grid); border-radius: 4px; }
.fp-b i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--tc, var(--good)); transform-origin: left; animation: grow .9s var(--ease) both .15s; }

.fp-r.good { --tc: var(--good); } .fp-r.warn { --tc: var(--warn); } .fp-r.bad { --tc: var(--bad); }
.fp-v { font-size: 14px; color: var(--ink-2); white-space: nowrap; } .fp-v b { color: var(--tc); font-size: 15px; margin-right: 4px; }
.fs-g { margin-bottom: 16px; }
.fs-c { position: relative; height: 150px; display: flex; gap: 14px; align-items: flex-end; padding: 0 84px 22px 4px; border-bottom: 1px solid var(--line); }
.fs-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.fs-col > span { position: absolute; bottom: -20px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.fs-bar { width: min(56px, 70%); background: var(--tc, var(--good)); border-radius: 4px 4px 0 0; position: relative; animation: grow .9s var(--ease) both; transform-origin: bottom; }

.fs-col.good { --tc: color-mix(in srgb, var(--good) 75%, var(--surface)); } .fs-col.warn { --tc: color-mix(in srgb, var(--warn) 80%, var(--surface)); } .fs-col.bad { --tc: color-mix(in srgb, var(--bad) 80%, var(--surface)); }

.fp-due { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); } .fp-due.bad b { color: var(--bad); } .fp-due.warn b { color: var(--warn); }
/* KPI 띠 */
.kstrip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.k { position: relative; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gc, var(--brand-2)); border-radius: 8px; padding: 10px 12px 9px; text-decoration: none; color: var(--ink); overflow: hidden; }
.k:hover { border-color: var(--gc); }
.k .l { font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.k .v small { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-left: 2px; letter-spacing: 0; }
.k .s { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k .s .up { color: var(--good); font-weight: 700; } .k .s .dn { color: var(--bad); font-weight: 700; }
.k .ring { position: absolute; top: 28px; right: 14px; width: 46px; height: 46px; }
.k .ring .arc { stroke: var(--gc); }
.k:has(.ring) .l, .k:has(.ring) .v { padding-right: 64px; }
.k .mb { height: 5px; border-radius: 3px; background: var(--grid); margin-top: 7px; position: relative; overflow: hidden; }
.k .mb i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gc); border-radius: 3px; transform-origin: left; animation: grow .9s var(--ease) both .2s; }
.k .dot { position: absolute; right: 10px; top: 11px; width: 9px; height: 9px; border-radius: 50%; background: var(--good); }
.k .dot.warn { background: var(--warn); } .k .dot.bad { background: var(--bad); animation: pulse 1.6s ease-out 3; color: var(--bad); }
/* 라인 타일 */
.lines { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.ln { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; position: relative; }
.ln .hd { display: flex; align-items: center; gap: 6px; }
.ln .hd b { font-size: 15px; font-weight: 800; }
.ln .fam { font-size: 12.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: var(--gt); color: var(--gc); }
.ln .pc { margin-left: auto; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ln .pc.good { color: var(--good); } .ln .pc.warn { color: var(--warn); } .ln .pc.bad { color: var(--bad); }
.ln .nums { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; font-variant-numeric: tabular-nums; }
.ln .nums b { color: var(--ink); font-size: 13px; }
.ln .pb { position: relative; height: 7px; border-radius: 4px; background: var(--grid); margin: 6px 0 4px; }
.ln .pb i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--gc); transform-origin: left; animation: grow .9s var(--ease) both .25s; }
.ln .pb em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.ln svg.sp { display: block; width: 100%; height: 34px; margin-top: 4px; }
.ln svg.sp path.ar { fill: var(--gt); }
.ln svg.sp path.li { fill: none; stroke: var(--gc); stroke-width: 2; stroke-linejoin: round; animation: draw 1.2s var(--ease) backwards .3s; }
.ln svg.sp circle.pt { fill: transparent; cursor: default; }
.ln svg.sp circle.pt:hover { fill: var(--gc); }
.ln .sp-cap { font-size: 11.5px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ln .sp-ax { display: flex; justify-content: space-between; font-size: 11px; }
.ln .nx { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 2단 */
/* 줄 규칙(.row2 전체 폭 · .row3 반반)은 ui/theme.css 공통 규칙 */
.wo-g { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
.wo-l { display: grid; gap: 3px; border: 1px solid var(--line); border-left: 4px solid var(--good); border-radius: 0 8px 8px 0; padding: 8px 12px; font-size: 13px; }
.wo-l.bad { border-left-color: var(--warn); background: var(--warn-bg); }
.wo-l em { font-style: normal; font-weight: 800; font-size: 12.5px; } .wo-l em.ok { color: var(--good); } .wo-l em.no { color: var(--warn); }
table.wo-c th small { display: block; font-weight: 500; }
@media (max-width: 980px) { .wo-g { grid-template-columns: 1fr; } }
/* 그룹 표 */
table.gt { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.gt th { font-size: 12.5px; font-weight: 700; color: var(--ink-3); text-align: right; padding: 4px 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.gt th.l, table.gt td.l { text-align: left; }
table.gt td { padding: 6px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.gt tr.sec td { font-size: 12.5px; font-weight: 800; color: var(--gc); border-bottom: 0; padding-top: 9px; letter-spacing: .04em; }
table.gt td.nm { font-weight: 700; text-align: left; }
table.gt td.nm i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--good); vertical-align: 1px; }
table.gt td.nm i.warn { background: var(--warn); } table.gt td.nm i.bad { background: var(--bad); }
table.gt td.gbar { width: 26%; min-width: 120px; }
.hb { position: relative; height: 10px; border-radius: 3px; background: var(--grid); }
.hb i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--gc); transform-origin: left; animation: grow .9s var(--ease) both; animation-delay: calc(.2s + var(--i, 0) * 50ms); }
.hb u { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--gc) 45%, transparent) 0 3px, transparent 3px 6px); }
.hb em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
table.gt .neg { color: var(--bad); font-weight: 700; } table.gt .pos { color: var(--good); font-weight: 700; } table.gt .mu { color: var(--ink-3); }
.more { font-size: 12.5px; margin-top: 6px; display: inline-block; }
/* 작은 차트 */
.lrow { display: grid; grid-template-columns: 34px 1fr 58px; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; }
.track { position: relative; height: 22px; background: var(--grid); border-radius: 4px; }
.seg { position: absolute; top: 0; bottom: 0; transform-origin: left; animation: grow .9s var(--ease) both; animation-delay: calc(.15s + var(--i, 0) * 90ms); }
.seg.s1 { background: var(--c1); left: 0; border-radius: 4px 0 0 4px; } .seg.s2 { background: var(--c2); box-shadow: -2px 0 0 var(--surface); border-radius: 0 4px 4px 0; }
.lrow .pct { text-align: right; font-weight: 800; }
.legend { display: flex; gap: 12px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 4px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.crow { display: grid; grid-template-columns: 34px repeat(4, 1fr); gap: 6px; align-items: center; font-size: 12.5px; margin: 5px 0; }
.crow.hd { color: var(--ink-3); font-weight: 700; } .crow.hd span { text-align: center; }
.cl { position: relative; height: 22px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.cl i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gc-c); transform-origin: left; animation: grow .9s var(--ease) both; animation-delay: calc(.1s + var(--i,0) * 40ms); }
.cl i.short { background: var(--warn); }
.cl span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; text-shadow: 0 0 3px var(--surface); }
table.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
table.mini td { padding: 5px 4px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.mini td.r { text-align: right; font-variant-numeric: tabular-nums; }
.basis { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.basis summary { cursor: pointer; font-weight: 700; color: var(--ink-2); }
.basis ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.7; }
/* 메뉴: 촘촘한 칩 */
.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.menu h3 { font-size: 12.5px; letter-spacing: .06em; color: var(--ink-3); margin: 0 0 6px; }
.menu a { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 14px; font-weight: 600; }
.menu a:hover { background: var(--hover); }

.menu a em { font-style: normal; font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: auto; }
.tipbox { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12.5px; box-shadow: var(--shadow-up); z-index: 40; display: none; white-space: nowrap; }
#h-lock .unlock { margin-top: 6px; }
@media (max-width: 1280px) { .kstrip, .lines { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 980px) { .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

</style>

<header id="shell" data-page="home" data-crumb="종합" data-title="도금·컬러 가동계획" data-sub="가동계획 · 생산실적 · 소재 발주 통합 조회"></header>
<main class="wrap">
  <div class="meta"><span id="h-meta"></span></div>
  <section class="card" id="h-lock" style="margin-top:12px" hidden>
    <h2>요약 — 분석 암호를 입력하세요</h2>
    <form class="unlock" id="h-form" style="justify-content:flex-start"><input type="password" id="h-pw" placeholder="분석 암호" autocomplete="current-password" aria-label="분석 암호"><button type="submit">열기</button></form>
    <p class="hint" id="h-msg"></p>
  </section>
  <div class="dash" id="h-dash">
    <div class="own" id="h-own"><div class="skel" style="grid-column:1/-1"><i style="width:30%"></i><i></i></div></div>
    <section class="card" id="h-fc" hidden></section>
    <section class="card" id="h-grp" hidden></section>
    <section class="card" id="h-need" hidden></section>
    <details class="more-d" id="h-more">
      <summary>실무 상세 <small>라인별 진도 · 2주 일정 · 현장 작업지시 · 월별 도금 계획 · 발주 마감</small></summary>
      <div class="dash">
        <div class="lines" id="h-lines"></div>
        <div class="row2"><section class="card" id="h-week" hidden></section><section class="card" id="h-wo" hidden></section></div>
        <div class="row3"><section class="card" id="h-load" data-pl="G" hidden></section><section class="card" id="h-due" hidden></section></div>
      </div>
    </details>
    <details class="basis" id="h-basis" hidden></details>
  </div>
</main>
<footer class="foot"><div class="wrap"><span>자료는 암호화되어 게시되며 이 브라우저 안에서만 풉니다</span><span>POSCO STEELEON 도금·컬러 가동계획</span></div></footer>
