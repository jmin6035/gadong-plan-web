<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b3a75'/><rect x='10' y='10' width='12' height='12' rx='1.5' transform='rotate(45 16 16)' fill='none' stroke='%23fff' stroke-width='2.6'/></svg>">

<style>
.hero-kpis { margin-top: 4px; }
.kpi .v .pm { font-size: 17px; font-weight: 700; margin-left: 6px; }
.kpi a.go { position: absolute; inset: 0; }
.grid2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
.grid2 > * { min-width: 0; }
@media (max-width: 880px) { .grid2 { grid-template-columns: 1fr; } }
/* 월별 도금 부하 */
.load { display: grid; gap: 14px; margin-top: 4px; }
.lrow { display: grid; grid-template-columns: 54px 1fr 74px; gap: 12px; align-items: center; font-size: 15px; }
.lrow .m { color: var(--ink-2); font-weight: 600; }
.track { position: relative; height: 34px; background: var(--grid); border-radius: 6px; }
.seg { position: absolute; top: 0; bottom: 0; border-radius: 0 4px 4px 0; transform-origin: left; animation: grow .9s var(--ease) both; animation-delay: calc(.15s + var(--i, 0) * 90ms); }
.seg.s1 { background: var(--c1); left: 0; border-radius: 4px 0 0 4px; }
.seg.s2 { background: var(--c2); box-shadow: -2px 0 0 var(--surface); }
.seg:hover { filter: brightness(1.08); }
.cap { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }
.lrow .pct { text-align: right; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; font-size: 13.5px; color: var(--ink-2); margin: 0 0 10px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.capk { width: 2px; height: 12px; border-radius: 1px; background: var(--ink); }
.tipbox { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font-size: 12px; box-shadow: var(--shadow-up); z-index: 40; display: none; white-space: nowrap; }
/* 결론 */
.decide { border: 1px solid var(--line); border-left: 4px solid var(--brand-2); border-radius: 0 10px 10px 0; padding: 14px 16px; background: var(--tint-2); font-size: 15px; line-height: 1.7; }
.decide b.tag { display: inline-block; font-size: 12px; letter-spacing: .08em; color: var(--brand-2); margin-bottom: 4px; }
/* 메뉴 타일 */
.groups { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 980px) { .groups { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .groups { grid-template-columns: 1fr; } }
.group h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; color: var(--gc); font-weight: 800; display: flex; align-items: center; gap: 8px; }
.group h3::before { content: ""; width: 18px; height: 3px; border-radius: 2px; background: var(--gc); }
.group { --gc: var(--brand-2); } .group:nth-child(2) { --gc: #0a9e8f; } .group:nth-child(3) { --gc: #c27a00; } .group:nth-child(4) { --gc: #5b6b80; }
.tile { position: relative; display: grid; grid-template-columns: 42px 1fr; gap: 4px 12px; align-items: start; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--shadow); transition: transform .25s var(--ease), box-shadow .25s, border-color .25s; overflow: hidden; }
.tile::after { content: "→"; position: absolute; right: 14px; top: 13px; color: var(--ink-3); transition: transform .25s var(--ease), color .25s; }
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); border-color: var(--gc); }
.tile:hover::after { transform: translateX(4px); color: var(--brand-2); }
.tile .ic { grid-row: span 2; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--gc) 13%, var(--surface)); color: var(--gc); border: 1px solid color-mix(in srgb, var(--gc) 25%, transparent); }
.tile .ic svg { width: 22px; height: 22px; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gc); opacity: 0; transition: opacity .25s; } .tile:hover::before { opacity: 1; }
.tile b { font-size: 15.5px; padding-right: 18px; }
.tile span { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.tile .new { display: inline-block; font-size: 10px; font-weight: 700; color: var(--brand-2); border: 1px solid var(--brand-2); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
#h-lock .unlock { margin-top: 6px; }
.exl { display: grid; gap: 8px; }
.ex { display: grid; grid-template-columns: 34px 82px 1fr auto; gap: 12px; align-items: center; padding: 11px 14px; border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 0 10px 10px 0; background: var(--surface); text-decoration: none; color: var(--ink); font-size: 16px; transition: transform .2s var(--ease), box-shadow .2s; }
.ex:hover { transform: translateX(3px); box-shadow: var(--shadow-up); }
.ex.bad { border-left-color: var(--bad); background: var(--bad-bg); }
.ex.warn { background: var(--warn-bg); }
.ex .no { font-weight: 800; color: var(--ink-3); text-align: center; }
.ex .ar { font-size: 13px; font-weight: 800; border-radius: 6px; padding: 3px 0; text-align: center; background: var(--tint-2); color: var(--brand); }
.ex .who { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
@media (max-width: 640px) { .ex { grid-template-columns: 26px 1fr; gap: 4px 10px; font-size: 15px; } .ex .no { grid-row: span 3; align-self: start; } .ex > * { grid-column: 2; min-width: 0; } .ex > .no { grid-column: 1; } .ex .ar { justify-self: start; padding: 2px 8px; } }
table.acc td.l b { font-size: 16px; } .accd { display: flex; gap: 6px; flex-wrap: wrap; } .accd span { font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; background: var(--surface-2); } .accd span.lo { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.tile .only { position: absolute; right: 36px; top: 14px; font-size: 10.5px; font-weight: 700; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
:root[data-scope="C"] .tile[data-only="G"], :root[data-scope="G"] .tile[data-only="C"] { filter: grayscale(1) opacity(.5); }
.crow { display: grid; grid-template-columns: 54px repeat(4, 1fr); gap: 8px; align-items: center; font-size: 14px; margin: 8px 0; }
.crow .m { font-weight: 700; color: var(--ink-2); }
.cl { position: relative; height: 30px; border-radius: 6px; background: var(--grid); overflow: hidden; }
.cl i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c2); transform-origin: left; animation: grow .9s var(--ease) both; animation-delay: calc(.1s + var(--i,0) * 60ms); }
.cl i.short { background: var(--warn); }
.cl span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; color: var(--ink); text-shadow: 0 0 3px var(--surface); }
.crow.hd { font-size: 13px; color: var(--ink-3); font-weight: 700; margin-bottom: 0; } .crow.hd span { text-align: center; }
#h-due table.t td.l { white-space: normal; }
#h-due table.t { font-size: 14px; }
/* 마케팅 그룹별 진도 */
.gp-head { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; color: var(--ink-2); margin: -4px 0 14px; }
.gp-head b { color: var(--ink); }
.gp-sec { font-size: 14px; font-weight: 800; letter-spacing: .04em; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
.gp-sec::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: var(--gc); }
.gp-sec[data-dom] { color: var(--gc); }
.gp { display: grid; grid-template-columns: 190px minmax(0, 1.25fr) minmax(0, 1fr); gap: 10px 22px; align-items: start; padding: 14px 16px; border: 1px solid var(--line); border-left: 5px solid var(--gc); border-radius: 0 8px 8px 0; background: var(--surface); margin-bottom: 8px; }
.gp .nm { font-size: 18px; font-weight: 800; line-height: 1.3; }
.gp .nm small { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-3); margin-top: 3px; }
.gp .st { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
.gp .st.good { background: var(--good-bg); color: var(--good); } .gp .st.warn { background: var(--warn-bg); color: var(--warn); } .gp .st.bad { background: var(--bad-bg); color: var(--bad); }
.gp .k { font-size: 12.5px; font-weight: 800; color: var(--ink-3); letter-spacing: .05em; margin-bottom: 4px; }
.gp .big { font-size: 17px; } .gp .big b { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -.5px; }
.gp .bar { position: relative; height: 14px; border-radius: 4px; background: var(--grid); margin: 8px 0 7px; overflow: visible; }
.gp .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--gc); }
.gp .bar u { position: absolute; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--gc) 40%, transparent) 0 4px, transparent 4px 8px); }
.gp .bar em { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.gp .ln { font-size: 15px; line-height: 1.65; color: var(--ink-2); } .gp .ln b { color: var(--ink); }
.gp .ln .neg { color: var(--bad); font-weight: 700; } .gp .ln .pos { color: var(--good); font-weight: 700; }
.gp-note { font-size: 13px; color: var(--ink-3); margin-top: 10px; line-height: 1.7; }
@media (max-width: 900px) { .gp { grid-template-columns: 1fr; gap: 8px; } }
</style>
