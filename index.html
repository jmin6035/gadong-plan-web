<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가동계획 포털</title>
<meta name="description" content="포스코스틸리온 도금·컬러 가동계획 포털 — 오늘 핵심 지표와 메뉴">
<script>if (/[?&]src=/.test(location.search)) location.replace('status.html' + location.search);</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b3a75'/><rect x='10' y='10' width='12' height='12' rx='1.5' transform='rotate(45 16 16)' fill='none' stroke='%23fff' stroke-width='2.6'/></svg>">
<link rel="stylesheet" href="ui/theme.css">
<style>
.hero-kpis { margin-top: 4px; }
.kpi .v .pm { font-size: 17px; font-weight: 700; margin-left: 6px; }
.kpi a.go { position: absolute; inset: 0; }
.grid2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
.grid2 > * { min-width: 0; }
@media (max-width: 880px) { .grid2 { grid-template-columns: 1fr; } }
/* 월별 도금 부하 */
.load { display: grid; gap: 14px; margin-top: 4px; }
.lrow { display: grid; grid-template-columns: 54px 1fr 74px; gap: 12px; align-items: center; font-size: 15px; }
.lrow .m { color: var(--ink-2); font-weight: 600; }
.track { position: relative; height: 34px; background: var(--grid); border-radius: 6px; }
.seg { position: absolute; top: 0; bottom: 0; border-radius: 0 4px 4px 0; transform-origin: left; animation: grow .9s var(--ease) both; animation-delay: calc(.15s + var(--i, 0) * 90ms); }
.seg.s1 { background: var(--c1); left: 0; border-radius: 4px 0 0 4px; }
.seg.s2 { background: var(--c2); box-shadow: -2px 0 0 var(--surface); }
.seg:hover { filter: brightness(1.08); }
.cap { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }
.lrow .pct { text-align: right; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; font-size: 13.5px; color: var(--ink-2); margin: 0 0 10px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.capk { width: 2px; height: 12px; border-radius: 1px; background: var(--ink); }
.tipbox { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font-size: 12px; box-shadow: var(--shadow-up); z-index: 40; display: none; white-space: nowrap; }
/* 결론 */
.decide { border: 1px solid var(--line); border-left: 4px solid var(--brand-2); border-radius: 0 10px 10px 0; padding: 14px 16px; background: linear-gradient(120deg, var(--tint-2), var(--surface)); font-size: 15px; line-height: 1.7; }
.decide b.tag { display: inline-block; font-size: 12px; letter-spacing: .08em; color: var(--brand-2); margin-bottom: 4px; }
/* 메뉴 타일 */
.groups { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 980px) { .groups { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .groups { grid-template-columns: 1fr; } }
.group h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; color: var(--gc); font-weight: 800; display: flex; align-items: center; gap: 8px; }
.group h3::before { content: ""; width: 18px; height: 3px; border-radius: 2px; background: var(--gc); }
.group { --gc: var(--brand-2); } .group:nth-child(2) { --gc: #0a9e8f; } .group:nth-child(3) { --gc: #c27a00; } .group:nth-child(4) { --gc: #5b6b80; }
.tile { position: relative; display: grid; grid-template-columns: 42px 1fr; gap: 4px 12px; align-items: start; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--shadow); transition: transform .25s var(--ease), box-shadow .25s, border-color .25s; overflow: hidden; }
.tile::after { content: "→"; position: absolute; right: 14px; top: 13px; color: var(--ink-3); transition: transform .25s var(--ease), color .25s; }
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); border-color: var(--gc); }
.tile:hover::after { transform: translateX(4px); color: var(--brand-2); }
.tile .ic { grid-row: span 2; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--gc) 13%, var(--surface)); color: var(--gc); border: 1px solid color-mix(in srgb, var(--gc) 25%, transparent); }
.tile .ic svg { width: 22px; height: 22px; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gc); opacity: 0; transition: opacity .25s; } .tile:hover::before { opacity: 1; }
.tile b { font-size: 15.5px; padding-right: 18px; }
.tile span { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.tile .new { display: inline-block; font-size: 10px; font-weight: 700; color: var(--brand-2); border: 1px solid var(--brand-2); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
#h-lock .unlock { margin-top: 6px; }
#h-due table.t td.l { white-space: normal; }
#h-due table.t { font-size: 14px; }
</style>
</head>
<body>
<header id="shell" data-page="home" data-crumb="홈" data-title="도금·컬러 가동계획 포털" data-sub="계획 → 실적 → 소재 조달을 한 곳에서"></header>
<main class="wrap">
  <div class="docmeta" id="h-meta"></div>

  <section class="card" id="h-today" style="margin-top:12px">
    <h2>오늘의 핵심 <small id="h-asof"></small><span class="unit">단위: 톤</span></h2>
    <div id="h-kpis" class="kpis hero-kpis">
      <div class="skel" style="grid-column:1/-1"><i style="width:30%"></i><i></i><i style="width:70%"></i></div>
    </div>
    <div id="h-lock" hidden>
      <p class="hint" style="margin:0">핵심 지표는 분석 암호로 열립니다. 아래 메뉴는 바로 쓸 수 있습니다.</p>
      <form class="unlock" id="h-form" style="justify-content:flex-start"><input type="password" id="h-pw" placeholder="분석 암호" autocomplete="current-password" aria-label="분석 암호"><button type="submit">열기</button></form>
      <p class="hint" id="h-msg"></p>
    </div>
  </section>

  <div class="grid2" id="h-detail" hidden>
    <section class="card" id="h-load"></section>
    <section class="card" id="h-due"></section>
  </div>

  <section class="card" id="h-menu">
    <h2>메뉴</h2>
    <div class="groups" id="h-groups"></div>
  </section>
</main>
<footer class="foot"><div class="wrap"><span>자료는 암호화되어 게시되며 이 브라우저 안에서만 풉니다 · 계산: tools/portal_data.py</span><span>POSCO STEELEON 도금·컬러 가동계획</span></div></footer>
<div class="tipbox" id="h-tip" role="tooltip"></div>
<script src="ui/shell.js"></script>
<script src="engine/crypto.js"></script>
<script src="portal.js"></script>
</body>
</html>
