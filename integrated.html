<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4분기 통합 가동계획</title>
<meta name="description" content="컬러·도금·소재 2026년 4분기 통합 일별 가동계획 — 자가재 기준 두 안(V1 계산값 / V2 자가재계획) 비교, 배정 근거">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b3a75'/><rect x='10' y='10' width='12' height='12' rx='1.5' transform='rotate(45 16 16)' fill='none' stroke='%23fff' stroke-width='2.6'/></svg>">
<link rel="stylesheet" href="ui/legacy.css">
<link rel="stylesheet" href="ui/theme.css">
<style>
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .vs { grid-template-columns: 1fr; } }
.vcol { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); }
.vcol.on { border: 2px solid var(--brand); }
.vcol h3 { margin: 0 0 6px; color: var(--ink); font-size: 15px; }
.vcol ul { margin: 0; padding-left: 18px; } .vcol li { margin: 3px 0; }
.gantt { overflow-x: auto; padding-bottom: 4px; }
.grow { display: grid; grid-template-columns: 54px repeat(var(--n), minmax(14px, 1fr)); align-items: end; gap: 0 2px; min-width: calc(54px + var(--n) * 16px); }
.grow .ln { font-size: 12px; font-weight: 700; color: var(--ink-2); align-self: stretch; display: flex; align-items: center; position: sticky; left: 0; background: var(--surface); z-index: 2; }
.day { height: 64px; display: flex; flex-direction: column-reverse; cursor: pointer; border-radius: 3px; position: relative; background: var(--surface-2); }
.day:hover, .day.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.day i { display: block; width: 100%; }
.day i:first-child { border-radius: 0 0 3px 3px; }
.day.act { opacity: .45; }
.day .ev { position: absolute; top: -2px; left: 50%; transform: translateX(-50%); font-size: 10px; line-height: 1; color: var(--ink); }
.day.sd { background: repeating-linear-gradient(45deg, var(--surface-2) 0 3px, var(--line) 3px 6px); }
.camp { height: 8px; border-radius: 2px; margin-bottom: 2px; }
.dlab { font-size: 10px; color: var(--ink-3); text-align: center; }
.dlab.we { color: var(--down); }
.detail { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.detail h3 { margin: 0 0 6px; color: var(--ink); }
.rule { margin: 0; padding-left: 18px; } .rule li { margin: 4px 0; }
.rule b { color: var(--ink); }
.neg { color: var(--bad); font-weight: 700; }

table.cmp td.rec { background: var(--good-bg); }
table.cmp th.rec { background: linear-gradient(180deg, #1d7a46, #15603a); color: #fff; }
table.cmp td.best { color: var(--good); font-weight: 700; }
table.cmp td { text-align: center; }
table.heat td, table.heat th { text-align: center; padding: 6px 6px; }
table.heat td.nm, table.calt td.nm { font-weight: 700; white-space: nowrap; }
.h-ok { background: color-mix(in srgb, var(--good) 14%, transparent); }
.h-warn { background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.h-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.h-over { background: color-mix(in srgb, var(--ink-3) 22%, transparent); }
.legend i.box.h-ok, .legend i.box.h-warn, .legend i.box.h-bad, .legend i.box.h-over { border: 1px solid var(--line); }
tr.sep td { border-top: 2px solid var(--line); }
table.calt { font-size: 12px; }
table.calt th, table.calt td { padding: 4px 2px; min-width: 34px; text-align: center; }
table.calt th.we { color: var(--down); }
table.calt .stick { position: sticky; left: 0; background: var(--surface); z-index: 2; min-width: 64px; text-align: left; padding-left: 6px; }
table.calt td.cell { background: color-mix(in srgb, var(--c) 30%, var(--surface)); cursor: pointer; font-variant-numeric: tabular-nums; }
table.calt td.cell.act { background: var(--surface-2); color: var(--ink-3); }
table.calt td.mc { box-shadow: inset 0 0 0 2px var(--ink); }
table.calt td.off { color: var(--ink-3); cursor: pointer; }
table.calt td.sd { background: repeating-linear-gradient(45deg, var(--surface-2) 0 3px, var(--line) 3px 6px); color: var(--ink-2); }
table.calt td.camp { background: color-mix(in srgb, var(--c) 55%, var(--surface)); color: var(--ink); font-weight: 700; font-size: 11px; border-left: 2px solid var(--surface); }
table.calt td.sum { font-weight: 700; }
table.calt td.selc { outline: 2px solid var(--ink); outline-offset: -2px; }
table.rules td.wrap, table.sum td.wrap { white-space: normal; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; font-size: 13px; }
.flow span { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 5px 9px; }
.flow i { color: var(--ink-3); font-style: normal; }
</style>
</head>
<body>
<header id="shell" data-page="integrated" data-crumb="가동계획" data-title="4분기 통합 가동계획" data-sub="컬러 1~4CCL · 도금 1·2CGL · 소재 — 2026년 10~12월"></header>
<div class="wrap pagebar noprint"><span class="lbl">자가재 기준</span><div class="seg" role="group" aria-label="자가재 기준"></div></div>
<main class="wrap" id="g-main">
  <section class="card empty" id="g-lock">
    <h2 style="justify-content:center">통합 계획 불러오는 중…</h2>
    <form class="unlock" id="g-form" hidden>
      <input type="password" id="g-pw" placeholder="분석 암호" autocomplete="current-password" aria-label="분석 암호">
      <button type="submit">열기</button>
    </form>
    <p class="hint" id="g-msg"></p>
  </section>
</main>
<footer class="foot"><div class="wrap"><span>계산: tools/master_plan.py(월 물량 LP) → cglplan.color_full(컬러 일별) → cglplan MILP(도금 일별) → tools/integrated_plan.py(자가재·소재). 기초재고 = 9월말 재고현황, 컬러 10/1~5는 실적.</span><span>POSCO STEELEON 도금·컬러 가동계획</span></div></footer>
<script src="ui/shell.js"></script>
<script src="engine/crypto.js"></script>
<script src="integrated.js"></script>
</body>
</html>
