<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소재 조달 판단</title>
<meta name="description" content="필요 시점에 따라 가능한 업체를 판단하고 구매 요청서를 만드는 소재 조달 보드">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b3a75'/><rect x='10' y='10' width='12' height='12' rx='1.5' transform='rotate(45 16 16)' fill='none' stroke='%23fff' stroke-width='2.6'/></svg>">
<link rel="stylesheet" href="ui/theme.css">
<style>
table.bd td { vertical-align: top; }
table.bd td.why { min-width: 210px; max-width: 280px; }
table.bd select { max-width: 190px; }
table.bd tr.u.on > td { background: var(--surface-2); }
table.bd tr.ux > td { background: var(--surface-2); white-space: normal; text-align: left; border-bottom: 1px solid var(--line); }
table.t input[type=text], table.ed input:not([type]) { width: 120px; }
table.ed td { text-align: center; }
table.ed input[size] { width: 48px; }
.tg { border: 0; background: var(--steel-1); color: var(--brand); cursor: pointer; font-size: 11px; width: 20px; height: 20px; border-radius: 5px; margin-right: 4px; transition: background .2s; }
.tg:hover { background: var(--steel-2); }
.use { display: flex; flex-wrap: wrap; gap: 5px 10px; font-size: 12.5px; margin: 2px 0 8px; }
.use b:first-child { width: 100%; color: var(--ink-2); font-size: 12px; }
.use span { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; }
.use span.no { color: var(--ink-3); text-decoration: line-through; }
.use i { font-style: normal; color: var(--ink-3); }
.x { border: 0; background: none; color: var(--ink-3); cursor: pointer; border-radius: 5px; width: 24px; height: 24px; }
.x:hover { background: var(--bad-bg); color: var(--bad); }
.bar input[type=date], .bar input[type=number] { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
</style>
</head>
<body>
<header id="shell" data-page="procure" data-crumb="소재 · 운영" data-title="소재 조달 판단" data-sub="필요 시점 → 가능한 업체 → 구매 요청"></header>
<main class="wrap">
  <div class="docmeta" id="p-meta"></div>
  <div id="p-main" style="margin-top:12px">
    <section class="card lock" id="p-lock">
      <div id="p-lockbox"><div class="ic" aria-hidden="true">🔒</div>
      <h2>불러오는 중…</h2>
      <form class="unlock" id="p-form" hidden>
        <input type="password" id="p-pw" placeholder="분석 암호" autocomplete="current-password" aria-label="분석 암호">
        <button type="submit">열기</button>
      </form>
      <p class="hint" id="p-msg"></p></div>
      <div class="skel" id="p-skel" hidden aria-label="불러오는 중"><i style="width:40%"></i><i></i><i style="width:85%"></i><i style="width:65%"></i></div>
    </section>
  </div>
</main>
<footer class="foot"><div class="wrap"><span>v0 — 주문재는 마케팅 목록 전까지 추정치 · 기발주는 입고예정 탭에 넣어야 반영 · 리드타임·우선순위는 소재구매그룹과 맞출 초기값</span><span>POSCO STEELEON 도금·컬러 가동계획</span></div></footer>

</html>
