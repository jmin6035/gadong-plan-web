tr.ux > td > div { text-align: left; } table.t.sp td.l, table.t.sp th.l { text-align: left !important; } .ux .use b:first-child { text-align: left; }
.ux .xh { font-size: 14px; margin: 2px 0 10px; } .ux .neg { color: var(--bad); font-weight: 800; } .ux .pos { color: var(--good); font-weight: 800; }

:root { --du-e: #2563c9; --du-l: #d0453a; --du-0: #eceae6; }

.du-tile.e .du-big b { color: var(--du-e); } .du-tile.l .du-big b { color: var(--du-l); } .du-tile.z .du-big b { font-size: 24px; }

table.du-g td { height: 54px; border-radius: 6px; text-align: center; color: var(--ink); cursor: default; }

.du-hms.one table.du-g { max-width: 640px; }

.du-chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--du-0); } .du-chip.e { background: color-mix(in srgb, var(--du-e) 16%, var(--surface)); color: var(--du-e); } .du-chip.l { background: color-mix(in srgb, var(--du-l) 16%, var(--surface)); color: var(--du-l); }
@media (max-width: 900px) { .du-tiles, .du-hms, .du-two { grid-template-columns: 1fr; } }

/* F/H 납기 비교(10/21 재작성) */

.fd-tile { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); }

.fd-row { display: grid; grid-template-columns: 210px 1fr 74px 74px 70px; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--grid); font-size: 14px; font-variant-numeric: tabular-nums; }
.fd-axr { border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); font-weight: 700; padding-bottom: 18px; }
.fd-sp { color: var(--ink-2); white-space: nowrap; } .fd-n, .fd-t { text-align: right; white-space: nowrap; } .fd-n { color: var(--bad); font-weight: 700; } .fd-n.a { color: var(--brand-2); } .fd-t { color: var(--ink-3); }
