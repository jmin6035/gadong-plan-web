<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소재 발주</title>
<meta name="description" content="필요 시점에 따라 가능한 업체를 판단하고 구매 요청서를 만드는 소재 조달 보드">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><clipPath id='c'><rect width='40' height='40' rx='11'/></clipPath></defs><g clip-path='url(%23c)'><rect width='40' height='40' fill='%231b3f5f'/><path d='M-6 30 30-6h9L3 30z' fill='%233774a1'/><path d='M4 40 40 4v9L13 40z' fill='%236cb1d8'/><path d='M17 40 40 17v8L25 40z' fill='%23fff'/></g></svg>">
<link rel="stylesheet" href="ui/theme.css">
<style>
table.bd { font-size: 14px; }
table.bd td { vertical-align: top; padding: 10px 9px; }
table.bd th { padding: 11px 9px; }
table.bd td:nth-child(2) { white-space: normal; min-width: 130px; }
table.bd td.jd { min-width: 230px; max-width: 300px; white-space: normal; }
table.bd td.jd .why { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; margin-top: 6px; }
table.bd td.dec { min-width: 220px; white-space: normal; }
.onlyshort { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.onlyshort input { width: 16px; height: 16px; accent-color: var(--brand-2); }
.dg { display: grid; grid-template-columns: minmax(130px, 1fr) 78px 92px; gap: 6px 8px; }
.dg select, .dg input { width: 100%; max-width: none !important; }
@media (max-width: 640px) { .dg { grid-template-columns: 1fr 1fr; } }
.dg label { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: var(--ink-3); font-weight: 700; }
table.bd input.memo { width: 100% !important; max-width: none; margin-top: 6px; }
table.bd td b { font-size: 15px; }
table.bd select { max-width: 200px; }

table.bd tr.u.on > td { background: var(--tint-2) !important; }
table.bd tr.ux > td { background: var(--tint) !important; white-space: normal; text-align: left; border-bottom: 1px solid var(--line); }
table.t input[type=text], table.ed input:not([type]) { width: 120px; }
table.ed td { text-align: center; }
table.ed input[size] { width: 48px; }
.tg { border: 0; background: var(--tint-2); color: var(--brand); cursor: pointer; font-size: 12px; width: 24px; height: 24px; border-radius: 5px; margin-right: 4px; transition: background .2s; }
.tg:hover { background: var(--steel-2); }
.use { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 14px; margin: 4px 0 10px; }
.use b:first-child { width: 100%; color: var(--brand); font-size: 13px; }
.use span { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; }
.use span.no { color: var(--ink-3); text-decoration: line-through; }
.use i { font-style: normal; color: var(--ink-3); }
.x { border: 0; background: none; color: var(--ink-3); cursor: pointer; border-radius: 5px; width: 24px; height: 24px; }
.x:hover { background: var(--bad-bg); color: var(--bad); }
.bar input[type=date], .bar input[type=number] { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
/* 판단 보드: 조치 묶음 머리줄 · 결정 요약 버튼 · 펼친 입력칸 */
table.bd tr.grp-h td { background: var(--surface-2); font-weight: 800; font-size: 14px; color: var(--ink); padding: 9px 12px; border-top: 2px solid var(--line); text-align: left; }
table.bd tr.grp-h.g0 td { border-left: 4px solid var(--bad); } table.bd tr.grp-h.g1 td { border-left: 4px solid var(--warn); } table.bd tr.grp-h.g2 td { border-left: 4px solid var(--brand-2); } table.bd tr.grp-h.g3 td, table.bd tr.grp-h.g4 td { border-left: 4px solid var(--good); }
table.bd tr.grp-h .muted { font-weight: 600; margin-left: 8px; }
button.dsum { all: unset; cursor: pointer; display: inline-flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 13.5px; }
button.dsum .ds { font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); } button.dsum .ds.set { background: var(--good-bg); color: var(--good); }
button.dsum .go { color: var(--brand-2); font-size: 12.5px; } button.dsum:hover .go { text-decoration: underline; }
.dg.dg-open { grid-template-columns: minmax(200px, 1.4fr) 110px 130px minmax(220px, 2fr); margin-bottom: 10px; } .dg.dg-open label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-3); font-weight: 700; }
@media (max-width: 900px) { .dg.dg-open { grid-template-columns: 1fr 1fr; } }
table.arrsum th.late, table.arrsum td.late, .arrg .late, table td.late { color: var(--bad); font-weight: 800; }
table.arrsum tr.sum td { border-top: 2px solid var(--line); font-weight: 800; background: var(--surface-2); }
details.arrg { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 6px 0; } details.arrg > summary { cursor: pointer; font-size: 14px; } details.arrg[open] > summary { margin-bottom: 8px; }
tr.ux > td > div { text-align: left; } table.t.sp td.l, table.t.sp th.l { text-align: left !important; } .ux .use b:first-child { text-align: left; }
.ux .xh { font-size: 14px; margin: 2px 0 10px; } .ux .neg { color: var(--bad); font-weight: 800; } .ux .pos { color: var(--good); font-weight: 800; }
table.t.sp { width: auto; min-width: 640px; margin: 0 0 8px; background: var(--surface); } table.t.sp td, table.t.sp th { padding: 6px 12px; }
table.t.sp tr.on td { background: var(--good-bg); } table.t.sp tr.tot td { border-top: 2px solid var(--line); font-weight: 800; }
table.t.sp input { width: 96px; text-align: right; }
table.t.due td, table.t.due th { padding: 6px 10px; } table.t.due tr.sum td { background: var(--surface-2); border-top: 2px solid var(--line); font-weight: 700; } table.t.due b.early, table.t b.early { color: var(--good); } table.t.due td.l, table.t.due th.l { text-align: left !important; }
.dg2 { display: grid; grid-template-columns: 180px minmax(240px, 520px); gap: 8px 12px; margin: 6px 0 12px; } .dg2 label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-3); font-weight: 700; } .dg2 select, .dg2 input { width: 100%; max-width: none !important; }
@media (max-width: 640px) { .dg2 { grid-template-columns: 1fr; } table.t.sp { min-width: 0; } }
</style>
</head>
<body>
<header id="shell" data-page="procure" data-crumb="소재" data-title="소재 발주" data-sub="필요 시점 → 가능한 업체 → 구매 요청"></header>
<main class="wrap">
  <div class="docmeta" id="p-meta"></div>
  <div id="p-main" style="margin-top:12px">
    <section class="card lock" id="p-lock">
      <div id="p-lockbox"><div class="ic" aria-hidden="true">🔒</div>
      <h2>불러오는 중…</h2>
      <form class="unlock" id="p-form" hidden>
        <input type="password" id="p-pw" placeholder="분석 암호" autocomplete="current-password" aria-label="분석 암호">
        <button type="submit">열기</button>
      </form>
      <p class="hint" id="p-msg"></p></div>
      <div class="skel" id="p-skel" hidden aria-label="불러오는 중"><i style="width:40%"></i><i></i><i style="width:85%"></i><i style="width:65%"></i></div>
    </section>
  </div>
</main>

</html>
