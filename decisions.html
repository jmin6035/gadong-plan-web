<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결정 기록</title>
<meta name="description" content="가동계획·소재·재고 관련 결정과 할 일을 남기고 진행을 추적">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b3a75'/><rect x='10' y='10' width='12' height='12' rx='1.5' transform='rotate(45 16 16)' fill='none' stroke='%23fff' stroke-width='2.6'/></svg>">
<link rel="stylesheet" href="ui/theme.css">
<style>
.form { display: grid; grid-template-columns: 140px 1fr 1fr 160px 160px; gap: 10px; align-items: end; }
.form label { display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.form .wide { grid-column: 1 / -2; }
.form input, .form select, .form textarea { font: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.form textarea { min-height: 44px; resize: vertical; }
@media (max-width: 900px) { .form { grid-template-columns: 1fr 1fr; } .form .wide { grid-column: 1 / -1; } }
.mode { border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 15px; }
.mode.off { background: var(--warn-bg); color: var(--warn); } .mode.on { background: var(--good-bg); color: var(--good); }
td select { font: inherit; font-size: 14.5px; }
td.dt { white-space: normal; min-width: 280px; text-align: left; }
.overdue { color: var(--bad); font-weight: 800; }
</style>
</head>
<body>
<header id="shell" data-page="decisions" data-crumb="자료" data-title="결정 기록" data-sub="누가 · 무엇을 · 언제까지 — 회의·보고에서 정한 것을 남기고 진행을 추적"></header>
<main class="wrap">
  <div id="d-main" style="margin-top:16px">
    <div class="mode off" id="d-mode"></div>
    <section class="card"><h2>새로 남기기</h2>
      <form class="form" id="d-form">
        <label>분야<select id="f-area"><option>도금</option><option>컬러</option><option>소재</option><option>재고</option><option>판매</option><option>기타</option></select></label>
        <label>결정·할 일<input id="f-title" required placeholder="예: 12월 1CGL 공백 9천t → 1월분 선생산"></label>
        <label>근거·메모<input id="f-detail" placeholder="예: 1월 AZ 수출 물량, 재고 목표 대비"></label>
        <label>담당<input id="f-owner" placeholder="부서·이름"></label>
        <label>기한<input id="f-due" type="date"></label>
        <label class="wide">상태<select id="f-status"><option>결정</option><option>할 일</option><option>확인 대기</option><option>완료</option><option>보류</option></select></label>
        <button type="submit" class="btn primary">남기기</button>
      </form>
    </section>
    <section class="card" id="d-list"><h2>기록 <small id="d-count"></small></h2>
      <div class="pagebar"><div class="tabs" id="d-filter"></div></div>
      <div class="scroll"><table class="t"><thead><tr><th>날짜</th><th>분야</th><th class="l">결정·할 일</th><th>담당</th><th>기한</th><th>상태</th><th>남긴 사람</th></tr></thead><tbody id="d-body"></tbody></table></div>
    </section>
    <section class="card"><h2>공유 설정</h2>
      <p class="small">여러 사람이 같은 기록을 보려면 Supabase 에 표를 만들고 공개용 키를 넣습니다(설치 문서: docs/공유저장소_설정.sql). 공개용(publishable/anon) 키만 넣으세요 — 비밀 키는 절대 넣지 마세요.</p>
      <div class="bar"><input class="field" id="d-key" placeholder="sb_publishable_... (공개용 키)" style="min-width:360px"><button type="button" class="btn" id="d-keysave">이 브라우저에 저장</button><input class="field" id="d-me" placeholder="내 이름(남긴 사람)" style="max-width:200px"></div>
    </section>
  </div>
</main>
<footer class="foot"><div class="wrap"><span>저장: 공유 설정 전에는 이 브라우저, 설정 후에는 Supabase 표(decisions)</span><span>POSCO STEELEON 도금·컬러 가동계획</span></div></footer>
<script src="ui/shell.js"></script>
<script src="ui/share.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const today = new Date().toLocaleDateString('sv-SE');
  const ST = ['결정', '할 일', '확인 대기', '완료', '보류'];
  const SEED = [
    { area: '도금', title: '통합 4분기 계획 V1 확정 (V2·V3 제외)', detail: '자가재 = 컬러 생산일 − 5일, 10일 단위. 컬러 AZ 소재 부족 없음', owner: '생산기획', due: '2026-10-07', status: '결정', at: '2026-10-07T09:00:00' },
    { area: '도금', title: '12월 1CGL 공백 약 9천t — 1월분 선생산 또는 감산 결정', detail: 'FH 1월분 발주량에도 영향', owner: '생산기획', due: '2026-10-21', status: '확인 대기', at: '2026-10-07T09:01:00' },
    { area: '소재', title: '소재 기발주·입고예정 조회 화면 개발 요청', detail: '조달 판단의 충당 계산에 필요', owner: '전산팀', due: '2026-10-14', status: '할 일', at: '2026-10-07T09:02:00' },
    { area: '도금', title: '도금 속도·M/C 손실 실적 보정값 계획 반영 검토', detail: '계획 정확도: 2CGL 계획 대비 −20% 안팎으로 치우침', owner: '생산', due: '2026-10-21', status: '할 일', at: '2026-10-09T09:00:00' },
  ];
  let filt = '미완료', rows = [];
  const me = () => { try { return localStorage.getItem('cgl-me') || ''; } catch (e) { return ''; } };
  function mode() {
    $('d-mode').className = 'mode ' + (SHARE.on() ? 'on' : 'off');
    $('d-mode').textContent = SHARE.on() ? '공유 저장 켜짐 — 모든 사람이 같은 기록을 봅니다' : '지금은 이 브라우저에만 저장됩니다 — 아래 공유 설정을 하면 모두가 같은 기록을 봅니다';
    $('d-me').value = me();
  }
  async function load() {
    try { rows = await SHARE.list('decisions'); } catch (e) { rows = []; UI.toast(e.message); }
    if (!rows.length && !SHARE.on()) { for (const s of SEED) await SHARE.add('decisions', Object.assign({ by: '초기값' }, s)); rows = await SHARE.list('decisions'); }
    draw();
  }
  function draw() {
    const F = [['미완료', (r) => r.status !== '완료' && r.status !== '보류'], ['전체', () => true], ...ST.map((s) => [s, (r) => r.status === s])];
    $('d-filter').innerHTML = F.map(([k]) => `<button type="button" data-f="${k}" aria-pressed="${k === filt}">${k}</button>`).join('');
    const L = rows.filter(F.find((x) => x[0] === filt)[1]);
    $('d-count').textContent = `${L.length}건 / 전체 ${rows.length}`;
    $('d-body').innerHTML = L.map((r) => `<tr data-id="${esc(r.id)}"><td>${esc(String(r.at || '').slice(5, 10).replace('-', '/'))}</td><td class="c"><b>${esc(r.area)}</b></td><td class="l dt"><b>${esc(r.title)}</b>${r.detail ? `<br><span class="small">${esc(r.detail)}</span>` : ''}</td><td>${esc(r.owner || '')}</td>
      <td class="${r.due && r.due < today && !['완료', '보류', '결정'].includes(r.status) ? 'overdue' : ''}">${esc(String(r.due || '').slice(5).replace('-', '/'))}</td><td><select data-st>${ST.map((s) => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td><td class="muted">${esc(r.by || '')}</td></tr>`).join('') || '<tr><td colspan="7" class="c muted">없음</td></tr>';
    $('d-filter').querySelectorAll('button').forEach((b) => b.onclick = () => { filt = b.dataset.f; draw(); });
    $('d-body').querySelectorAll('select[data-st]').forEach((s) => s.onchange = async () => { const id = s.closest('tr').dataset.id; await SHARE.update('decisions', id, { status: s.value }); UI.toast('상태 바꿈'); load(); });
  }
  $('d-form').onsubmit = async (e) => {
    e.preventDefault();
    await SHARE.add('decisions', { area: $('f-area').value, title: $('f-title').value.trim(), detail: $('f-detail').value.trim(), owner: $('f-owner').value.trim(), due: $('f-due').value || null, status: $('f-status').value, by: me() || '이름 없음' });
    e.target.reset(); UI.toast('남김'); load();
  };
  $('d-keysave').onclick = () => { SHARE.setKey($('d-key').value); mode(); load(); };
  $('d-me').onchange = () => { try { localStorage.setItem('cgl-me', $('d-me').value.trim()); } catch (e) { /* 무시 */ } };
  mode(); load();
})();
</script>
</body>
</html>
