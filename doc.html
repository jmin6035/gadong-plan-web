<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>회의 자료</title>
<style>
:root{--bg:#f5f7fa;--ink:#18212d;--line:#dfe4eb;--accent:#2f5d8a}
@media (prefers-color-scheme: dark){:root{--bg:#11161d;--ink:#e8edf3;--line:#2b3542;--accent:#7fb0e0;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
#lock{max-width:420px;margin:80px auto;padding:0 16px;text-align:center}
#lock input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;min-width:200px;font:inherit}
#lock button{padding:8px 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
#msg{color:#b3261e;font-size:13px;margin-top:8px}
</style></head><body>
<div id="lock"><h2>회의 자료 — 암호를 입력하세요</h2>
<form id="f"><input type="password" id="pw" placeholder="분석 암호" aria-label="분석 암호"> <button>열기</button></form><p id="msg"></p></div>
<div id="doc"></div>
<script src="engine/crypto.js"></script>
<script>
(function(){
  const name=(new URLSearchParams(location.search).get('d')||'').replace(/[^\w-]/g,'');
  const KEY='cgl-analysis-pw'; let env=null;
  async function open(pw){
    try{const o=await GP.decryptJSON(env,pw);try{localStorage.setItem(KEY,pw)}catch(e){}
      document.title=o.title||document.title;document.getElementById('lock').hidden=true;document.getElementById('doc').innerHTML=o.html;}
    catch(e){document.getElementById('msg').textContent='암호가 맞지 않습니다';}
  }
  document.getElementById('f').onsubmit=e=>{e.preventDefault();open(document.getElementById('pw').value)};
  fetch('published/docs/'+name+'.enc.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(e=>{env=e;let s=null;try{s=localStorage.getItem(KEY)}catch(x){} if(s)open(s)})
   .catch(()=>{document.getElementById('msg').textContent='자료를 찾을 수 없습니다'});
})();
</script></body></html>
